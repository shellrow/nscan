[package]
name = "nscan"
version = "1.6.0"
authors = ["shellrow <shellrow@foctal.com>"]
edition = "2024"
rust-version = "1.94"
description = "Cross-platform network scan tool for host and service discovery"
repository = "https://github.com/shellrow/nscan"
homepage = "https://github.com/shellrow/nscan"
readme = "README.md"
documentation = "https://github.com/shellrow/nscan"
keywords = ["network","security","scan","cli","cross-platform"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
anyhow = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
netdev = { version = "0.47", features = ["serde"] }
nex = { version = "0.28", features = ["serde", "async"] }
futures = {version = "0.3", features = ["executor", "thread-pool"]}
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
x509-parser = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] } 
hickory-proto = "0.26"
hickory-resolver = { version = "0.26" }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
clap = { version = "4.5", features = ["derive", "cargo"] }
ipnet = "2.11"
termtree = "1"
ndb-oui = { version = "0.4", features = ["bundled"] }
ndb-tcp-service = { version = "0.4", features = ["bundled"] }
ndb-udp-service = { version = "0.4", features = ["bundled"] }
home = "0.5"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3"

tempfile = "3"
quick-xml = { version = "0.42", features = ["serialize"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
